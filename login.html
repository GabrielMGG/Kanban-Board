<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Login</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/login.css">

</head>

<body>

  <div class="login-card">

    <!-- LOGO -->
    <div class="logo-area">
      <div class="logo-badge">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="logo-name">TaskFlow</div>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab active login">Entrar</button>
      <button class="tab register">Criar conta</button>
    </div>

    <!-- FORM ENTRAR-->
    <div class="form-body">

      <form id="login">
        <div class="field">
          <p id="error-message" style="display:none; color: red;">Email ou senha incorretos</p>
          <label for="email">E-mail</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="4" width="20" height="16" rx="2" />
                <path d="M2 7l10 7 10-7" />
              </svg>
            </span>
            <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required />
          </div>
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" />
                <path d="M7 11V7a5 5 0 0110 0v4" />
              </svg>
            </span>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
            <button class="input-toggle" type="button" aria-label="Mostrar senha" data-password="password">
              <svg class="open-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>

              <!-- OLHOS FECHADOS-->
              <svg class="close-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                <path d="M14.12 14.12A3 3 0 1 1 9.88 9.88" />
                <path d="M1 1l22 22" />
              </svg>
            </button>
          </div>
        </div>

        <div class="forgot">
          <a href="#">Esqueceu sua senha?</a>
        </div>

        <button class="btn-login" type="submit">Entrar</button>
      </form>
      <div class="divider">OU</div>

      <div class="social-btns">
        <button id="google" class="btn-social" type="button">
          <!-- Google SVG -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4" />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853" />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
              fill="#FBBC05" />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335" />
          </svg>
          Entrar com Google
        </button>
      </div>

      <div class="signup-hint register tab" style="margin-top:24px;">
        Não tem conta? <a href="#">Criar conta</a>
      </div>

    </div><!-- /.form-body -->



    <!-- PAINEL: CADASTRO -->
    <div class="panel" id="panel-register">
      <form id="register">

        <div class="field-row">
          <div class="field">
            <label for="reg-name">Nome</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="8" r="4" />
                  <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
                </svg>
              </span>
              <input type="text" id="reg-name" placeholder="Seu nome" autocomplete="given-name" required />
            </div>
          </div>
          <div class="field">
            <label for="reg-lastname">Sobrenome</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="8" r="4" />
                  <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
                </svg>
              </span>
              <input type="text" id="reg-lastname" placeholder="Sobrenome" autocomplete="family-name" required />
            </div>
          </div>
        </div>

        <div class="field">
          <label for="reg-email">E-mail</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="4" width="20" height="16" rx="2" />
                <path d="M2 7l10 7 10-7" />
              </svg>
            </span>
            <input type="email" id="reg-email" placeholder="seu@email.com" autocomplete="email" required />
          </div>
        </div>

        <div class="field">
          <label for="reg-password">Senha</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" />
                <path d="M7 11V7a5 5 0 0110 0v4" />
              </svg>
            </span>
            <input type="password" id="reg-password" minlength="8" placeholder="Mín. 8 caracteres"
              autocomplete="new-password" oninput="checkStrength(this.value)" required />
            <button class="input-toggle" type="button" aria-label="Mostrar senha" data-password="reg-password">
              <svg class="open-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>

              <!-- OLHOS FECHADOS-->
              <svg class="close-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                <path d="M14.12 14.12A3 3 0 1 1 9.88 9.88" />
                <path d="M1 1l22 22" />
              </svg>
            </button>
          </div>
          <div class="password-strength">
            <div class="strength-bar" id="bar1"></div>
            <div class="strength-bar" id="bar2"></div>
            <div class="strength-bar" id="bar3"></div>
            <div class="strength-bar" id="bar4"></div>
          </div>
          <div class="strength-label" id="strength-label"></div>
        </div>

        <div class="field">
          <label for="reg-confirm">Confirmar senha</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" />
                <path d="M7 11V7a5 5 0 0110 0v4" />
              </svg>
            </span>
            <input type="password" id="reg-confirm" placeholder="Repita a senha" autocomplete="new-password" required />
            <button class="input-toggle" type="button" aria-label="Mostrar senha" data-password="reg-confirm">
              <svg class="open-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>

              <!-- OLHOS FECHADOS-->
              <svg class="close-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                <path d="M14.12 14.12A3 3 0 1 1 9.88 9.88" />
                <path d="M1 1l22 22" />
              </svg>
            </button>
          </div>
          <p id="error-message-register" style="display:none; color: red;">As senhas não coincidem!</p>
        </div>

        <label class="check-field">
          <input type="checkbox" required />
          Concordo com os <a href="#">Termos de uso</a> e a <a href="#">Política de privacidade</a>
        </label>

        <button class="btn-register" type="submit">Criar conta</button>

        <div class="signup-hint login tab" style="margin-top:4px;">
          Já tem conta? <a href="#" onclick="switchTab('login')">Entrar</a>
        </div>
      </form>

    </div><!-- /#panel-register -->
    <footer>© 2026 TaskFlow. Desenvolvido por <a class="gabriel-dev" href="https://gabrieldev.io/">GabrielDev</a>.
    </footer>
  </div><!-- /.login-card -->


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/login.js"></script>
  <script src="assets/js/utils.js"></script>
</body>

</html>
